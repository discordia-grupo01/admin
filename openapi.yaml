openapi: 3.0.3
info:
  title: Discordia - Admin
  version: "1.0.0"
  description: |
    API del backoffice de Discordia (épica Administración). Todos los endpoints
    `/v1/admin/*` requieren `Authorization: Bearer <JWT>` de un usuario que sea
    staff de la plataforma.

    **Estado**: implementados todos los endpoints: `/livez`, `/readyz`,
    `GET /v1/admin/users` (#31), `GET /v1/admin/servers` (#32),
    `POST` / `DELETE /v1/admin/users/{id}/suspension` (#29 y #30),
    `DELETE /v1/admin/servers/{id}` (#68) y
    `POST` / `DELETE /v1/admin/servers/{id}/suspension` (#69) y
    `GET /v1/admin/{users|servers}/{id}/dossier[/{section}]` (#81) y
    `/v1/admin/recovery-requests` (recuperación de cuenta sin segundo factor).

    **Consistencia eventual**: suspender o reactivar (un usuario o un servidor)
    cambia el estado en admin al instante y publica un evento; los demás
    servicios lo aplican a los pocos instantes. Lo mismo al aprobar o rechazar
    una solicitud de recuperación de cuenta: identify desactiva el 2FA (o solo
    avisa al usuario) cuando procesa el evento.

    **Expediente (#81)**: admin lo arma solo con datos locales, que le llegan
    por eventos (réplicas), así que puede ir unos segundos por detrás de los
    servicios de origen. Por minimización de datos nunca incluye el contenido de
    un mensaje, quién hizo un reporte ni quién aplicó una acción de moderación.
    La actividad de mensajes se conserva 90 días y empieza a registrarse desde
    el despliegue de esta versión; por eso un reporte de un mensaje anterior o
    más viejo que la retención no se puede atribuir a su autor
    (`reported_user_id: null`).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Users
  - name: Servers
  - name: Dossier
  - name: Recovery
paths:
  /livez:
    get:
      tags: [Health]
      summary: Liveness check
      description: Confirma que el proceso está vivo. No consulta dependencias.
      security: []
      responses:
        "200":
          description: El proceso está vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: alive }
  /readyz:
    get:
      tags: [Health]
      summary: Readiness check
      description: Confirma que las dependencias críticas (Postgres, RabbitMQ) responden.
      security: []
      responses:
        "200":
          description: Listo para recibir tráfico
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
        "503":
          description: Alguna dependencia no responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unavailable }
                  failed:
                    type: array
                    items: { type: string }
                    example: [postgres]
  /v1/admin/users:
    get:
      tags: [Users]
      summary: Listar usuarios con filtros (HU #31)
      description: |
        Lista paginada, ordenada por fecha de registro descendente. `search`
        busca por email o nombre (parcial, sin distinguir mayúsculas).
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
          description: Texto a buscar en el email o el nombre. Los caracteres `%`, `_` y `\` se toman como texto literal.
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Usuarios que cumplen los filtros (puede ser una lista vacía)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { $ref: "#/components/responses/InvalidQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/users/{id}/suspension:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Users]
      summary: Suspender a un usuario (HU #29)
      description: |
        Impide que el usuario inicie sesión y use la plataforma. El estado
        cambia en admin al instante y, en la misma transacción, queda escrito
        el evento `admin.user_suspended` (firmado con HMAC) para que lo publique
        el outbox; los demás servicios lo aplican a los pocos instantes. No se
        puede suspender a un miembro del staff (incluido uno mismo). Un `{id}`
        que no es un UUID se trata como usuario inexistente.
      responses:
        "200":
          description: Usuario suspendido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: No es staff (`FORBIDDEN`) o el objetivo es staff (`CANNOT_SUSPEND_STAFF`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: El usuario no existe (`USER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: El usuario ya estaba suspendido (`USER_ALREADY_SUSPENDED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Users]
      summary: Reactivar a un usuario suspendido (HU #30)
      description: |
        Levanta la suspensión: el usuario vuelve a estar activo en admin al
        instante y, en la misma transacción, queda escrito el evento
        `admin.user_reactivated` (firmado con HMAC) para que lo publique el
        outbox. Los demás servicios dejan de bloquear al usuario al procesarlo.
        Un `{id}` que no es un UUID se trata como usuario inexistente.
      responses:
        "200":
          description: Usuario reactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: El usuario no existe (`USER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: El usuario no estaba suspendido (`USER_NOT_SUSPENDED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/admin/servers:
    get:
      tags: [Servers]
      summary: Listar los servidores de la plataforma (HU #32)
      description: |
        Lista paginada, ordenada por fecha de creación descendente. Un servidor
        aparece cuando llega su alta a la réplica y desaparece cuando se elimina.
        Los suspendidos siguen apareciendo, con `suspended_at` informado.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
          description: Texto a buscar en el nombre del servidor (parcial, sin distinguir mayúsculas). Los caracteres `%`, `_` y `\` se toman como texto literal.
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended] }
          description: Deja solo los servidores activos o solo los suspendidos. Sin este parámetro se listan todos; otro valor da `400 INVALID_QUERY`.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Servidores que cumplen el filtro (puede ser una lista vacía)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerList" }
        "400": { $ref: "#/components/responses/InvalidQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Servers]
      summary: Eliminar un servidor desde el backoffice (HU #68)
      description: |
        Pide la eliminación definitiva del servidor con todos sus canales,
        mensajes y roles. El staff confirma escribiendo el nombre del servidor
        (`confirm_name`), que se compara sin espacios en los bordes y distinguiendo
        mayúsculas contra el nombre que admin tiene replicado.

        Admin **no borra nada**: registra el pedido y, en la misma transacción,
        deja escrito el evento `admin.server_deletion_requested` (firmado con
        HMAC) para que lo publique el outbox. `servers` ejecuta el borrado y
        avisa con `servers.server_deleted`; recién entonces el servidor
        desaparece de `GET /v1/admin/servers`. Hasta ese momento (normalmente
        unos segundos) sigue en el listado. Si el evento se pierde el servidor
        no se borra y el pedido se puede repetir: cada pedido publica un evento
        con una `version` mayor y `servers` es idempotente.

        Es irreversible. Un `{id}` que no es un UUID se trata como servidor
        inexistente. Sin `confirm_name` o con un nombre distinto no se hace nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteServerRequest" }
      responses:
        "202":
          description: Pedido aceptado; la eliminación se completa de forma asíncrona. Sin cuerpo.
        "400":
          description: El cuerpo no es un JSON válido (`INVALID_BODY`) o `confirm_name` falta o no es el nombre del servidor (`DELETE_CONFIRMATION_MISMATCH`, con `details.field = "confirm_name"`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: El servidor no existe, todavía no llegó a la réplica o ya fue eliminado (`SERVER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/admin/servers/{id}/suspension:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Servers]
      summary: Suspender un servidor (HU #69)
      description: |
        Bloquea el uso del servidor sin eliminarlo: ningún miembro, ni su owner,
        puede leer, escribir, entrar a voz, invitar, editar, transferir ni
        eliminarlo (salvo abandonarlo), pero su contenido se conserva. El estado
        cambia en admin al instante y, en la misma transacción, queda escrito el
        evento `admin.server_suspended` (firmado con HMAC) para que lo publique
        el outbox; servers, messaging y voz lo aplican a los pocos instantes. El
        servidor sigue en `GET /v1/admin/servers`, con `suspended_at` informado.

        Se puede suspender un servidor de cualquier dueño. Un `{id}` que no es un
        UUID se trata como servidor inexistente.
      responses:
        "200":
          description: Servidor suspendido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: El servidor no existe, todavía no llegó a la réplica o ya fue eliminado (`SERVER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: El servidor ya estaba suspendido (`SERVER_ALREADY_SUSPENDED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Servers]
      summary: Levantar la suspensión de un servidor (HU #69)
      description: |
        Sus miembros recuperan el acceso normal. El servidor vuelve a estar
        activo en admin al instante y, en la misma transacción, queda escrito el
        evento `admin.server_reactivated` (firmado con HMAC), con una `version`
        mayor que la de la suspensión. Los demás servicios dejan de bloquearlo
        al procesarlo. Un `{id}` que no es un UUID se trata como servidor
        inexistente.
      responses:
        "200":
          description: Servidor reactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: El servidor no existe, todavía no llegó a la réplica o ya fue eliminado (`SERVER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: El servidor no estaba suspendido (`SERVER_NOT_SUSPENDED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/admin/users/{id}/dossier:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Dossier]
      summary: Expediente de investigación de un usuario (HU #81)
      description: |
        Resumen para investigar a un usuario: su estado y fecha de registro, la
        fecha de su última actividad y, de cada sección (`servers`, `activity`,
        `reports`, `moderation`), el total y los 5 ítems más recientes. Para ver
        más de una sección se pagina con `GET .../dossier/{section}`.

        Las acciones de moderación mezclan las del staff de la plataforma
        (`scope: platform`) con las de los moderadores de cada servidor
        (`scope: server`). Los reportes incluyen los hechos contra el usuario y
        los de mensajes que escribió.
      responses:
        "200":
          description: Resumen del expediente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDossierSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: El usuario no existe, o todavía no llegó su registro (`USER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/admin/users/{id}/dossier/{section}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: section
        in: path
        required: true
        schema: { type: string, enum: [servers, activity, reports, moderation, recovery_requests] }
    get:
      tags: [Dossier]
      summary: Una sección del expediente de un usuario, paginada (HU #81)
      description: Ordenada de la más nueva a la más vieja.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de la sección (puede ser vacía)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/DossierMembershipPage" }
                  - { $ref: "#/components/schemas/DossierActivityPage" }
                  - { $ref: "#/components/schemas/DossierReportPage" }
                  - { $ref: "#/components/schemas/DossierModerationPage" }
                  - { $ref: "#/components/schemas/DossierRecoveryRequestPage" }
        "400":
          description: La sección no existe (`INVALID_SECTION`) o `limit` / `offset` son inválidos (`INVALID_QUERY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: El usuario no existe (`USER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/admin/servers/{id}/dossier:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Dossier]
      summary: Expediente de investigación de un servidor (HU #81)
      description: |
        Resumen para investigar un servidor: sus datos (fecha de creación,
        miembros, dueño, estado), los mensajes enviados en cada uno de los
        últimos 7 días y, de reportes y moderación, el total y los 5 ítems más
        recientes.

        Los días de `messaging` son días **UTC**: un mensaje enviado a las 22 h
        en UTC-3 cuenta para el día siguiente. Siempre vienen los 7 días, del
        más viejo al más nuevo, con `messages: 0` donde no hubo actividad.

        Un servidor eliminado responde `404`: servers lo borra de forma
        permanente y admin descarta sus reportes, su actividad y las acciones de
        sus moderadores. Se conservan las acciones del staff sobre el servidor
        en el expediente de los usuarios afectados.
      responses:
        "200":
          description: Resumen del expediente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDossierSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: El servidor no existe, todavía no llegó su alta o fue eliminado (`SERVER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/admin/servers/{id}/dossier/{section}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: section
        in: path
        required: true
        schema: { type: string, enum: [reports, moderation] }
    get:
      tags: [Dossier]
      summary: Una sección del expediente de un servidor, paginada (HU #81)
      description: |
        Ordenada de la más nueva a la más vieja. En `moderation` hay acciones del
        staff sobre el servidor (suspender, reactivar, pedir su eliminación) y
        las de sus moderadores sobre sus miembros.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de la sección (puede ser vacía)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/DossierReportPage" }
                  - { $ref: "#/components/schemas/DossierModerationPage" }
        "400":
          description: La sección no existe (`INVALID_SECTION`) o `limit` / `offset` son inválidos (`INVALID_QUERY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: El servidor no existe o fue eliminado (`SERVER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/admin/recovery-requests:
    get:
      tags: [Recovery]
      summary: Listar solicitudes de recuperación de cuenta
      description: |
        Pedidos de usuarios con 2FA activo que perdieron la app autenticadora y
        todos sus códigos de recuperación. Llegan de identify por evento
        (`users.account_recovery_requested`). Lista paginada, de la más reciente
        a la más vieja. `search` busca por email o nombre del usuario (parcial,
        sin distinguir mayúsculas). El `total` con `status=pending` sirve de
        contador de pendientes.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
          description: Texto a buscar en el email o el nombre del usuario. Los caracteres `%`, `_` y `\` se toman como texto literal.
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RecoveryRequestStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Solicitudes que cumplen los filtros (puede ser una lista vacía)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryRequestList" }
        "400": { $ref: "#/components/responses/InvalidQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/recovery-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Recovery]
      summary: Detalle de una solicitud de recuperación de cuenta
      description: La solicitud con el usuario y cuántas solicitudes anteriores hizo. Un `{id}` que no es un UUID se trata como inexistente.
      responses:
        "200":
          description: La solicitud
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryRequestDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RecoveryRequestNotFound" }
  /v1/admin/recovery-requests/{id}/approval:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Recovery]
      summary: Aprobar una solicitud de recuperación de cuenta
      description: |
        Marca la solicitud como aprobada por el staff que llama y, en la misma
        transacción, deja escrito `admin.account_recovery_approved` (firmado con
        HMAC) para que lo publique el outbox. identify, al procesarlo, desactiva
        el 2FA del usuario, invalida sus códigos de recuperación y le avisa por
        email. Solo se puede resolver una vez: si dos miembros del staff la
        resuelven a la vez, uno recibe `409`.
      responses:
        "200":
          description: Solicitud aprobada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryRequestDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RecoveryRequestNotFound" }
        "409": { $ref: "#/components/responses/RecoveryRequestAlreadyResolved" }
  /v1/admin/recovery-requests/{id}/rejection:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Recovery]
      summary: Rechazar una solicitud de recuperación de cuenta
      description: |
        Marca la solicitud como rechazada y deja escrito
        `admin.account_recovery_rejected` (firmado). identify solo le avisa al
        usuario por email; el 2FA sigue activo y el usuario puede volver a pedirla.
      responses:
        "200":
          description: Solicitud rechazada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryRequestDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RecoveryRequestNotFound" }
        "409": { $ref: "#/components/responses/RecoveryRequestAlreadyResolved" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0, maximum: 100, default: 20 }
      description: Tamaño de página (máximo 100; un valor mayor se acota a 100).
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    InvalidQuery:
      description: Parámetros de consulta inválidos (`INVALID_QUERY`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Falta el token, es inválido o venció (`SESSION_EXPIRED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: El usuario no es staff de la plataforma (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RecoveryRequestNotFound:
      description: La solicitud no existe (`RECOVERY_REQUEST_NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RecoveryRequestAlreadyResolved:
      description: La solicitud ya fue aprobada o rechazada (`RECOVERY_REQUEST_ALREADY_RESOLVED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, example: FORBIDDEN }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    UserStatus:
      type: string
      enum: [active, pending, suspended]
      description: |
        `suspended` si el staff suspendió la cuenta; si no, `pending` mientras
        el usuario no confirmó su email y `active` después.
    User:
      type: object
      required: [id, name, email, avatar_url, status, created_at, suspended_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        avatar_url:
          type: string
          nullable: true
          description: |
            Dirección de la foto de perfil tal como la guarda identify: URL
            pública de Supabase Storage o ruta del gateway
            (`/uploads/profile-images/...`). null si no tiene foto o si su
            perfil todavía no se replicó.
        status: { $ref: "#/components/schemas/UserStatus" }
        created_at:
          type: string
          format: date-time
          description: Fecha de registro (UTC).
        suspended_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se suspendió; null si no está suspendido.
    UserList:
      type: object
      required: [users, total, limit, offset]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/User" }
        total: { type: integer, description: Cantidad de usuarios que cumplen los filtros. }
        limit: { type: integer }
        offset: { type: integer }
    Server:
      type: object
      required: [id, name, icon_url, owner_id, owner_name, member_count, created_at, suspended_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon_url:
          type: string
          nullable: true
          description: |
            Dirección del ícono tal como la guarda servers: URL pública de
            Supabase Storage o ruta del gateway (`/v1/servers/{id}/icon?v=...`).
            null si no tiene ícono o si la foto con ícono todavía no se replicó.
        owner_id: { type: string, format: uuid }
        owner_name:
          type: string
          nullable: true
          description: null si el perfil del dueño todavía no se replicó.
        member_count: { type: integer }
        created_at: { type: string, format: date-time }
        suspended_at:
          type: string
          format: date-time
          nullable: true
          description: Desde cuándo está suspendido (UTC). null si el servidor está activo.
    ServerList:
      type: object
      required: [servers, total, limit, offset]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/Server" }
        total: { type: integer, description: Cantidad de servidores que cumplen el filtro. }
        limit: { type: integer }
        offset: { type: integer }
    DeleteServerRequest:
      type: object
      required: [confirm_name]
      properties:
        confirm_name:
          type: string
          description: Nombre del servidor, tal como lo ve el staff. Sin espacios en los bordes; distingue mayúsculas.
          example: Sala de prueba
    DossierMembership:
      type: object
      required: [server_id, server_name, server_icon_url, joined_at]
      properties:
        server_id: { type: string, format: uuid }
        server_name:
          type: string
          nullable: true
          description: null si la foto del servidor todavía no se replicó.
        server_icon_url:
          type: string
          nullable: true
          description: |
            Dirección del ícono tal como la guarda servers (URL pública o ruta
            del gateway). null si no tiene ícono o si todavía no se replicó.
        joined_at: { type: string, format: date-time, description: Cuándo entró (UTC). }
    DossierActivity:
      type: object
      required: [id, kind, description, server_id, occurred_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [message_sent, joined_server, left_server] }
        description:
          type: string
          description: Texto listo para mostrar. Nunca incluye el contenido de un mensaje.
          example: Envió un mensaje en #general de GamersHub
        server_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
    DossierReport:
      type: object
      required: [id, reason, created_at, kind, status, resolved_at, server_id, server_name, reported_user_id, reported_user_name]
      description: |
        No incluye quién hizo el reporte ni quién lo resolvió.
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        kind: { type: string, enum: [user, message] }
        status: { type: string, enum: [pending, resolved, dismissed] }
        resolved_at: { type: string, format: date-time, nullable: true }
        server_id: { type: string, format: uuid }
        server_name: { type: string, nullable: true }
        reported_user_id:
          type: string
          format: uuid
          nullable: true
          description: |
            En un reporte de usuario, el reportado. En uno de mensaje, el autor
            del mensaje; es null si admin no lo conoce (el mensaje es anterior
            al despliegue, pasó la retención, o su evento todavía no llegó).
        reported_user_name: { type: string, nullable: true }
    DossierModerationAction:
      type: object
      required: [id, kind, applied_at, scope, server_id, server_name, target_user_id, target_user_name]
      description: |
        No incluye quién aplicó la acción.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [suspension, reactivation, deletion_requested, ban, unban, kick, mute, unmute]
          description: |
            `suspension`, `reactivation` y `deletion_requested` son del staff
            (`scope: platform`); el resto, de los moderadores de un servidor
            (`scope: server`).
        applied_at: { type: string, format: date-time }
        scope: { type: string, enum: [platform, server] }
        server_id:
          type: string
          format: uuid
          nullable: true
          description: El servidor donde ocurrió; null en una acción del staff sobre un usuario.
        server_name: { type: string, nullable: true }
        target_user_id:
          type: string
          format: uuid
          nullable: true
          description: Sobre quién; null en una acción del staff sobre un servidor.
        target_user_name: { type: string, nullable: true }
    MessagingDay:
      type: object
      required: [date, messages]
      properties:
        date: { type: string, format: date, example: "2026-11-08", description: Día UTC. }
        messages: { type: integer, minimum: 0 }
    UserDossierSummary:
      type: object
      required: [user, last_activity_at, counts, latest]
      properties:
        user: { $ref: "#/components/schemas/User" }
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: null si no hay actividad registrada.
        counts:
          type: object
          required: [servers, activity, reports, moderation, recovery_requests]
          properties:
            servers: { type: integer }
            activity: { type: integer }
            reports: { type: integer }
            moderation: { type: integer }
            recovery_requests: { type: integer }
        latest:
          type: object
          required: [servers, activity, reports, moderation, recovery_requests]
          description: Hasta 5 ítems de cada sección, del más nuevo al más viejo.
          properties:
            servers:
              type: array
              items: { $ref: "#/components/schemas/DossierMembership" }
            activity:
              type: array
              items: { $ref: "#/components/schemas/DossierActivity" }
            reports:
              type: array
              items: { $ref: "#/components/schemas/DossierReport" }
            moderation:
              type: array
              items: { $ref: "#/components/schemas/DossierModerationAction" }
            recovery_requests:
              type: array
              items: { $ref: "#/components/schemas/DossierRecoveryRequest" }
    ServerDossierSummary:
      type: object
      required: [server, messaging, counts, latest]
      properties:
        server: { $ref: "#/components/schemas/Server" }
        messaging:
          type: array
          minItems: 7
          maxItems: 7
          description: Últimos 7 días UTC, del más viejo al más nuevo, con ceros.
          items: { $ref: "#/components/schemas/MessagingDay" }
        counts:
          type: object
          required: [reports, moderation]
          properties:
            reports: { type: integer }
            moderation: { type: integer }
        latest:
          type: object
          required: [reports, moderation]
          description: Hasta 5 ítems de cada sección, del más nuevo al más viejo.
          properties:
            reports:
              type: array
              items: { $ref: "#/components/schemas/DossierReport" }
            moderation:
              type: array
              items: { $ref: "#/components/schemas/DossierModerationAction" }
    DossierMembershipPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DossierMembership" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    DossierActivityPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DossierActivity" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    DossierReportPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DossierReport" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    DossierModerationPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DossierModerationAction" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    DossierRecoveryRequestPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DossierRecoveryRequest" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    RecoveryRequestStatus:
      type: string
      enum: [pending, approved, rejected]
    StaffRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true, description: null si el usuario del staff no está en la réplica. }
    DossierRecoveryRequest:
      type: object
      required: [id, status, requested_at, resolved_at, resolved_by]
      description: Solicitud de recuperación de cuenta del usuario. No es una acción de moderación.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RecoveryRequestStatus" }
        requested_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by:
          allOf: [{ $ref: "#/components/schemas/StaffRef" }]
          nullable: true
    RecoveryRequest:
      type: object
      required: [id, user, user_id, message, status, requested_at, resolved_at, resolved_by]
      properties:
        id: { type: string, format: uuid }
        user:
          allOf: [{ $ref: "#/components/schemas/User" }]
          nullable: true
          description: null si el alta del usuario todavía no llegó a la réplica.
        user_id: { type: string, format: uuid }
        message: { type: string, maxLength: 500, description: Lo que contó el usuario; vacío si no escribió nada. }
        status: { $ref: "#/components/schemas/RecoveryRequestStatus" }
        requested_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by:
          allOf: [{ $ref: "#/components/schemas/StaffRef" }]
          nullable: true
          description: Quién la aprobó o rechazó; null mientras esté pendiente.
    RecoveryRequestList:
      type: object
      required: [requests, total, limit, offset]
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/RecoveryRequest" }
        total: { type: integer, description: Cantidad de solicitudes que cumplen los filtros. }
        limit: { type: integer }
        offset: { type: integer }
    RecoveryRequestDetail:
      allOf:
        - { $ref: "#/components/schemas/RecoveryRequest" }
        - type: object
          required: [previous_requests]
          properties:
            previous_requests:
              type: object
              required: [total, rejected]
              description: Solicitudes anteriores del mismo usuario.
              properties:
                total: { type: integer }
                rejected: { type: integer }
