name: Deploy

# Despliega admin en la VM de Oracle (discordia-admin-vm) en cada push a main.
# La VM tiene el repo clonado en ~/discordia/admin (rama main) y el .env de
# producción, que no se versiona. El deploy entra por SSH con una clave
# dedicada, actualiza el código y reconstruye el contenedor.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.ADMIN_VM_SSH_KEY }}
          HOST_KEY: ${{ secrets.ADMIN_VM_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Desplegar en la VM
        env:
          VM_HOST: ${{ secrets.ADMIN_VM_HOST }}
          VM_USER: ${{ secrets.ADMIN_VM_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" "SHA=$SHA bash -s" << 'REMOTE'
          set -euo pipefail
          cd ~/discordia/admin

          git fetch origin main
          git checkout main
          git reset --hard "$SHA"

          # La VM tiene 1 GB de RAM: compilar Go tarda, pero entra con el swap.
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f

          # Smoke test: el proceso tiene que responder /livez.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/livez > /dev/null; then
              echo "deploy OK: $SHA"
              curl -sS http://localhost:8080/readyz || true
              echo
              exit 0
            fi
            sleep 5
          done

          echo "La API no respondió /livez después del deploy" >&2
          docker compose -f docker-compose.prod.yml logs --tail=100 api >&2
          exit 1
          REMOTE