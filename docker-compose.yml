services:
  api:
    build: .
    ports:
      - "8080:8080"
    # Opcional: sin .env, `docker compose ps/exec` (y el resto de los servicios)
    # siguen funcionando; solo `api` necesita las variables para arrancar.
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro de la red de compose los servicios se alcanzan por nombre.
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discordia_admin
      POSTGRES_USER: discordia
      POSTGRES_PASSWORD: discordia
    ports:
      # 5433 en el host para no chocar con el Postgres de otros servicios
      # (identify, servers) ni con uno instalado localmente en el 5432.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discordia -d discordia_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
